/* layout: one paper column like a page from the book; index of recipes by category, a recipe opens as its own page */
:root{
  --paper:#f7f2e2; --card:rgba(255,253,246,.72); --ink:#403c36; --muted:#7c6f66;
  --wine:#a73556; --wine-deep:#7d2340; --rose:#efd6dd; --line:rgba(167,53,86,.28);
  --display:Lavi,"Frank Ruhl Libre","David",serif; --hand:Idealist,"Segoe Script",cursive;
  --body:Baznat,"Assistant","Arial",sans-serif; --label:Hadassah,"David",serif;
}
html{background:var(--paper)}
body{background:radial-gradient(ellipse at 50% 0%,#fbf8ec 0%,var(--paper) 55%,#efe7cf 100%) fixed,var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;font-size:17px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;position:relative}
.garland{display:block;width:min(728px,100%);height:auto;margin:0 auto;transform:scaleX(-1)}
.corner{position:absolute;left:-40px;top:8px;width:200px;transform:rotate(-58deg);opacity:.85;pointer-events:none}
header{text-align:center;padding-block:4px 10px}
h1{font-family:var(--display);font-weight:700;color:var(--wine);font-size:clamp(30px,6.4vw,50px);line-height:1.15;margin:6px 0 0;text-wrap:balance}
.sub{font-family:var(--hand);color:var(--wine);font-size:clamp(40px,7vw,58px);line-height:1;margin-top:8px}
.date{font-family:var(--label);color:var(--wine);letter-spacing:1px;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}

.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;margin-top:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:#fffdf6;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.search svg{flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);outline:none;padding:4px 0}
.search:focus-within{border-color:var(--wine);box-shadow:0 0 0 3px var(--rose)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:#fffdf6;color:var(--wine);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.chip:focus-visible,.row:focus-visible,.back:focus-visible,.wake:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

.cat h2{font-family:var(--display);color:var(--wine);font-size:26px;margin:26px 0 6px;display:flex;align-items:baseline;gap:10px}
.cat h2 small{font-family:var(--body);font-weight:300;font-size:14px;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:28px}
.row{display:flex;align-items:baseline;gap:8px;padding:9px 2px;border-bottom:1px dotted var(--line);color:inherit;text-decoration:none;cursor:pointer;min-width:0}
.row .t{font-weight:700;color:var(--ink)}
.row .s{font-family:var(--hand);color:var(--wine);font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row:hover .t{color:var(--wine)}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
.count{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}

/* recipe page */
.recipe{padding-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.back,.wake{font:inherit;font-size:15px;font-weight:700;color:var(--wine);background:#fffdf6;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.wake[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.tab{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 0;background:var(--wine);color:#fff;font-weight:700;font-size:14px;border-radius:0 0 14px 14px;padding:8px 18px;margin:0 auto}
.tab span+span::before{content:"";display:inline-block;width:1px;height:12px;background:#fff;margin:0 9px;vertical-align:-1px;opacity:.9}
.rhead{text-align:center;margin-top:10px}
.rhead h2{font-family:var(--display);color:var(--wine);font-size:clamp(30px,6vw,44px);line-height:1.15;margin:12px 0 0;text-wrap:balance}
.rhead .src{font-family:var(--hand);color:var(--wine);font-size:46px;line-height:1.1;margin-top:4px}
.sec{display:grid;grid-template-columns:28px 1fr;gap:0 14px;margin-top:28px}
.sec .lab{writing-mode:vertical-rl;font-family:var(--label);font-weight:700;color:var(--wine);font-size:15px;border-left:1px solid var(--wine);padding-left:6px;align-self:start;letter-spacing:.5px}
.sec>div{min-width:0}
.ing{columns:2 240px;column-gap:30px}
.ing .h{font-family:var(--label);font-weight:700;color:var(--wine);margin:10px 0 2px;break-after:avoid}
.ing .h:first-child{margin-top:0}
.ing label{display:flex;gap:9px;align-items:flex-start;padding:3px 0;break-inside:avoid;cursor:pointer}
.ing input{appearance:none;flex:none;width:17px;height:17px;border:1.5px solid var(--wine);border-radius:4px;margin-top:4px;background:#fffdf6;display:grid;place-content:center;cursor:pointer}
.ing input:checked{background:var(--wine)}
.ing input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(-1px,-1px)}
.ing input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ing input:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px;max-width:65ch}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--display);color:var(--wine);font-size:22px;line-height:1.1;text-align:center}
.nosteps{color:var(--muted);font-size:15px}
.bon{font-family:var(--hand);color:var(--wine);font-size:64px;text-align:center;margin-top:30px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px;font-size:15px}
.nav a{color:var(--wine);text-decoration:none;font-weight:700;max-width:48%}
.nav a:hover{text-decoration:underline}
.foot{display:block;width:min(453px,90%);margin:30px auto 0;transform:rotate(-8deg);opacity:.9}
.q{color:var(--wine)}
.addbtn{font:inherit;font-size:15px;font-weight:700;background:var(--wine);color:#fff;border:0;border-radius:999px;padding:7px 16px;cursor:pointer;flex:none}
.addbtn:focus-visible,.form button:focus-visible{outline:2px solid var(--wine-deep);outline-offset:2px}
.toprow{display:flex;gap:10px;align-items:center}
.toprow .search{flex:1;min-width:0}
.new{font-size:12px;font-weight:700;color:#fff;background:var(--wine);border-radius:999px;padding:1px 8px;flex:none;align-self:center}
.by{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
.form{background:rgba(255,253,246,.85);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.form h2{font-family:var(--display);color:var(--wine);font-size:30px;margin:0;text-align:center}
.form label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;color:var(--wine-deep);font-size:15px}
.form label.f span.hint{font-weight:300;color:var(--muted);font-size:13px}
.form input,.form select,.form textarea{font:inherit;font-weight:300;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.form textarea{min-height:130px;resize:vertical;line-height:1.5}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--wine);box-shadow:0 0 0 3px var(--rose)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start}
.form .err{color:var(--wine-deep);font-weight:700;font-size:15px;min-height:1em}
.ghost{font:inherit;font-size:15px;font-weight:700;color:var(--wine);background:#fffdf6;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.danger{color:#fff;background:var(--wine-deep);border-color:var(--wine-deep)}
.mine{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.confirm{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:20;font-size:15px}
@media (max-width:560px){.form .two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.recipe{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
@media (max-width:560px){.corner{display:none}.sec{grid-template-columns:22px 1fr;gap:0 10px}}
</style>

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = s => esc(s).replace(/\d[\d\-.]*[¼½¾]|\d+\/\d+/g, m => '<bdi dir="ltr">'+m+'</bdi>');
const BASE = [];
DATA.forEach((c,ci)=>c.recipes.forEach(r=>{ r.cat=c.name; r.ci=ci; r.id='r'+BASE.length; BASE.push(r); }));
let ADDED = [];          // from the shared db
let ALL = [];
let me = {id:null, owner:false}, coll = null, names = {};
function hay(r){ return (r.t+' '+r.s+' '+r.i.map(x=>x.x||x.h).join(' ')).toLowerCase(); }
function rebuild(){
  ALL = [];
  DATA.forEach((c,ci)=>{
    c.recipes.forEach(r=>{ r.hay=hay(r); ALL.push(r); });
    ADDED.filter(a=>a.ci===ci).forEach(a=>{ a.hay=hay(a); ALL.push(a); });
  });
}
rebuild();

let cat = -1;
const chips = document.getElementById('chips');
['הכל',...DATA.map(c=>c.name)].forEach((n,i)=>{
  const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=n;
  b.setAttribute('aria-pressed', i===0); b.onclick=()=>{cat=i-1; [...chips.children].forEach((x,j)=>x.setAttribute('aria-pressed', j===i)); renderIndex();};
  chips.appendChild(b);
});
const q = document.getElementById('q');
q.addEventListener('input', renderIndex);

function renderIndex(){
  const term = q.value.trim().toLowerCase();
  const terms = term.split(/\s+/).filter(Boolean);
  const idx = document.getElementById('index'); idx.innerHTML='';
  let n=0;
  DATA.forEach((c,ci)=>{
    if(cat>=0 && ci!==cat) return;
    const rs = ALL.filter(r=>r.ci===ci && terms.every(t=>r.hay.includes(t)));
    if(!rs.length) return;
    n+=rs.length;
    const sec=document.createElement('section'); sec.className='cat';
    sec.innerHTML=`<h2>${esc(c.name)} <small>${rs.length} מתכונים</small></h2><div class="list"></div>`;
    const list=sec.querySelector('.list');
    rs.forEach(r=>{
      const a=document.createElement('a'); a.className='row'; a.href='#'+r.id;
      a.innerHTML=`<span class="t">${esc(r.t)}</span>${r.s?`<span class="s">${esc(r.s)}</span>`:''}${r.added?'<span class="new">חדש</span>':''}`;
      list.appendChild(a);
    });
    idx.appendChild(sec);
  });
  document.getElementById('count').textContent = terms.length||cat>=0 ? `נמצאו ${n} מתכונים` : `${ALL.length} מתכונים מהמטבח של המשפחה`;
  if(!n) idx.innerHTML = `<div class="empty">לא מצאתי מתכון עם "${esc(q.value)}". נסו מילה אחרת.</div>`;
}

let wakeLock=null;
async function toggleWake(btn){
  try{
    if(wakeLock){ await wakeLock.release(); wakeLock=null; btn.setAttribute('aria-pressed','false'); btn.textContent='להשאיר את המסך דלוק'; return; }
    wakeLock = await navigator.wakeLock.request('screen');
    btn.setAttribute('aria-pressed','true'); btn.textContent='המסך יישאר דלוק';
    wakeLock.addEventListener('release',()=>{wakeLock=null;btn.setAttribute('aria-pressed','false');btn.textContent='להשאיר את המסך דלוק';});
  }catch(e){ btn.textContent='המכשיר לא מאפשר להשאיר את המסך דלוק'; btn.disabled=true; }
}

function renderRecipe(r){
  const v=document.getElementById('view');
  const i = ALL.indexOf(r), prev=ALL[i-1], next=ALL[i+1];
  const meta = [r.cat, ...(r.m? r.m.split('|').map(s=>s.trim()):[])];
  let ing='';
  r.i.forEach((x,k)=>{ ing += x.h ? `<div class="h">${fmt(x.h)}</div>` : `<label><input type="checkbox" id="${r.id}-i${k}"><span>${fmt(x.x)}</span></label>`; });
  v.innerHTML = `<article class="recipe">
    <div class="bar"><button class="back" type="button">→ לכל המתכונים</button>
      ${'wakeLock' in navigator ? '<button class="wake" type="button" aria-pressed="false">להשאיר את המסך דלוק</button>':''}</div>
    <div class="rhead"><div class="tab">${meta.map(m=>`<span>${fmt(m)}</span>`).join('')}</div>
      <h2>${esc(r.t)}</h2>${r.s?`<div class="src">${esc(r.s)}</div>`:''}
      ${r.added?`<div class="by" id="by"></div>`:''}
      ${r.added && (r.author===me.id || me.owner) && coll ? `<div class="mine" id="mine"><button class="ghost" type="button" id="edit">עריכה</button><button class="ghost" type="button" id="del">מחיקה</button></div>`:''}</div>
    <div class="sec"><div class="lab">רכיבים</div><div class="ing">${ing}</div></div>
    <div class="sec"><div class="lab">אופן ההכנה</div><div>${ r.p.length ? `<ol class="steps">${r.p.map(p=>`<li><span>${fmt(p)}</span></li>`).join('')}</ol>` : `<p class="nosteps">בדף המקורי לא נכתבו הוראות הכנה.</p>` }</div></div>
    <div class="bon">בתאבון!</div>
    <nav class="nav">${prev?`<a href="#${prev.id}">→ ${esc(prev.t)}</a>`:'<span></span>'}${next?`<a href="#${next.id}">${esc(next.t)} ←</a>`:'<span></span>'}</nav>
  </article>`;
  v.querySelector('.back').onclick=()=>{ location.hash='top'; };
  if(r.added){
    const by=v.querySelector('#by');
    if(by && r.author){ authorName(r.author).then(n=>{ by.textContent = n ? 'נוסף על ידי '+n : 'נוסף לאתר על ידי המשפחה'; }); }
    else if(by) by.textContent='נוסף לאתר על ידי המשפחה';
    const ed=v.querySelector('#edit'); if(ed) ed.onclick=()=>{ location.hash='edit-'+r.docId; };
    const del=v.querySelector('#del');
    if(del) del.onclick=()=>{
      const box=v.querySelector('#mine');
      box.innerHTML='<div class="confirm">למחוק את המתכון לכולם? <button class="ghost danger" type="button" id="yes">כן, למחוק</button><button class="ghost" type="button" id="no">ביטול</button></div>';
      box.querySelector('#no').onclick=()=>renderRecipe(r);
      box.querySelector('#yes').onclick=async()=>{
        try{ await coll.doc(r.docId).delete(); toast('המתכון נמחק'); location.hash='top'; }
        catch(e){ toast('המחיקה לא הצליחה. נסו שוב.'); }
      };
    };
  }
  const w=v.querySelector('.wake'); if(w) w.onclick=()=>toggleWake(w);
}

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
async function authorName(id){
  if(id in names) return names[id];
  try{ const user=await window.claude.use('user'); const ps=await user.profiles([id]); names[id]=(ps[id]&&ps[id].name)||''; }catch(e){ names[id]=''; }
  return names[id];
}
function toLines(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean);
}

    </div>
    <label class="f">חום וזמן אפייה <span class="hint">לא חובה, למשל: 180 מעלות, 40 דק'</span><input id="f-m" maxlength="60" value="${r?esc(r.m.replace(/ \| /g,', ')).replace(/"/g,'&quot;'):''}"></label>
    <label class="f">רכיבים <span class="hint">כל רכיב בשורה נפרדת. כותרת משנה מתחילה ב-#, למשל: # לציפוי</span><textarea id="f-i">${esc(ingTxt)}</textarea></label>
    <label class="f">אופן ההכנה <span class="hint">כל שלב בשורה נפרדת</span><textarea id="f-p">${r?esc(r.p.join('\n')):''}</textarea></label>
    <div class="err" id="f-err"></div>
    <div class="actions"><button class="addbtn" type="submit" id="f-save">${r?'שמירת שינויים':'הוספה לאתר'}</button><button class="ghost" type="button" id="f-cancel">ביטול</button></div>
  </form>`;
  v.querySelector('#f-cancel').onclick=()=>{ location.hash = r ? r.id : 'top'; };
  v.querySelector('#f').addEventListener('submit', async e=>{
    e.preventDefault();
    const err=v.querySelector('#f-err'), btn=v.querySelector('#f-save');
    const t=v.querySelector('#f-t').value.trim();
    const ing=toLines(v.querySelector('#f-i').value);
    if(!t){ err.textContent='צריך לכתוב שם למתכון.'; return; }
    if(!ing.length){ err.textContent='צריך לכתוב לפחות רכיב אחד.'; return; }
    const doc={ title:t, source:v.querySelector('#f-s').value.trim(), cat:+v.querySelector('#f-c').value,
      meta:v.querySelector('#f-m').value.trim().split(/\s*[,|]\s*/).filter(Boolean).join(' | '),
      ing, steps:toLines(v.querySelector('#f-p').value), updated:Date.now() };
    btn.disabled=true; err.textContent='';
    try{
      if(r){ doc.author=r.author||me.id; doc.created=r.created||Date.now(); await coll.doc(r.docId).set(doc); toast('השינויים נשמרו'); location.hash='a-'+r.docId; }
      else { doc.author=me.id; doc.created=Date.now(); const ref=coll.doc(); await ref.set(doc); toast('המתכון נוסף לכולם'); location.hash='a-'+ref.id; }
    }catch(ex){
      btn.disabled=false;
      err.textContent = (ex&&/permission|not_granted|denied|forbidden/i.test(ex.code||ex.message||'')) ? 'אין לך הרשאה לשמור את המתכון הזה.' : 'השמירה לא הצליחה. בדקו את החיבור ונסו שוב.';
    }
  });
  setTimeout(()=>v.querySelector('#f-t').focus(),50);
}

let lastScroll=0;
function route(){
  const id = location.hash.slice(1);
  if(id==='new' || id.startsWith('edit-')){
    const home=document.getElementById('home'), view=document.getElementById('view');
    if(!coll){ location.hash='top'; return; }
    const r = id==='new' ? null : ALL.find(x=>x.docId===id.slice(5));
    if(id!=='new' && !r){ return; }
    if(!home.hidden) lastScroll=scrollY;
    home.hidden=true; view.hidden=false; renderForm(r); scrollTo(0,0); return;
  }
  const r = ALL.find(x=>x.id===id);
  const home=document.getElementById('home'), view=document.getElementById('view');
  if(r){
    if(!home.hidden) lastScroll=scrollY;
    home.hidden=true; view.hidden=false; renderRecipe(r); scrollTo(0,0);
    document.title = r.t+' · מתכוני הבית של משפחת טיירי';
  } else {
    view.hidden=true; home.hidden=false; scrollTo(0,lastScroll);
    document.title='מתכוני הבית של משפחת טיירי';
  }
}
addEventListener('hashchange', route);
renderIndex(); route();
document.getElementById('addbtn').onclick=()=>{ location.hash='new'; };
const API = 'https://script.google.com/macros/s/AKfycbxfTEnv3buGbuoDxGwXK21a8xGx_d41aoIkeCEpwBc7M8u8FWaJkFWN4TXUn__5gqDp/exec';
function toAdded(id,x){ x=x||{}; return {
  docId:String(id), id:'a-'+id, added:true, author:x.author||null, created:+x.created||0,
  t:String(x.title||'מתכון'), s:String(x.source||''), m:String(x.meta||''), cat:(DATA[x.cat]||DATA[0]).name, ci:(DATA[x.cat]?+x.cat:0),
  i:(Array.isArray(x.ing)?x.ing:[]).map(l=>{ l=String(l); return l.startsWith('#')?{h:l.slice(1).trim()}:{x:l}; }),
  p:(Array.isArray(x.steps)?x.steps:[]).map(String) }; }
function applyAdded(list){
  ADDED = list.sort((a,b)=>a.created-b.created);
  rebuild(); renderIndex();
  const h=location.hash.slice(1);
  if(h.startsWith('a-') && document.activeElement?.tagName!=='TEXTAREA') route();
}
function deviceId(){
  let id=null; try{ id=localStorage.getItem('tyr-id'); }catch(e){}
  if(!id){ id='d'+Math.random().toString(36).slice(2,12); try{ localStorage.setItem('tyr-id',id); }catch(e){} }
  return id;
}
function remoteColl(){
  const call = async body => {
    body.by = me.id;
    const res = await fetch(API,{method:'POST',body:JSON.stringify(body)});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'failed');
    if(j.recipes) applyAdded(j.recipes.map(x=>toAdded(x.id,x)));
    return j;
  };
  return {
    load: async()=>{ const j=await (await fetch(API+'?api=1')).json(); if(j.ok) applyAdded(j.recipes.map(x=>toAdded(x.id,x))); },
    doc(id){ return { id:id||null,
      async set(d){ const j=await call({action:this.id?'update':'add', id:this.id, doc:d}); this.id=j.id||this.id; },
      async delete(){ await call({action:'delete', id:this.id}); } }; }
  };
}
(async()=>{
  if(window.claude){
    const db = await window.claude.use('db');
    if(!db) return;
    const user = await window.claude.use('user');
    if(user){ const m = await user.me(); me = {id:m.id, owner:m.isOwner}; }
    const canWrite = user ? await user.can('data.write') : null;
    coll = db.collection('recipes');
    if(canWrite !== false) document.getElementById('addbtn').hidden=false;
    coll.onSnapshot(snap=>applyAdded(snap.docs.map(d=>toAdded(d.id,d.data()))), ()=>{});
    return;
  }
  if(!/^https:\/\//.test(API)) return;
  me = {id:deviceId(), owner:false};
  coll = remoteColl();
  document.getElementById('addbtn').hidden=false;
  try{ await coll.load(); }catch(e){}
  addEventListener('visibilitychange',()=>{ if(!document.hidden) coll.load().catch(()=>{}); });
})();
</script>
